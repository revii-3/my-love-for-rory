<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Dearest Rory 💕🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: linear-gradient(135deg, #ffb7c5 0%, #ffc8d6 50%, #ff9eb5 100%); min-height: 100vh; font-family: 'Quicksand', sans-serif; overflow-x: hidden; position: relative; padding: 70px 16px 50px; display: flex; flex-direction: column; align-items: center; }
    #snowCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    #musicBadge { position: fixed; top: 16px; background: rgba(255, 255, 255, 0.32); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.65); color: #ffffff; padding: 9px 20px; border-radius: 50px; font-size: 13px; font-weight: 700; cursor: pointer; z-index: 10; box-shadow: 0 4px 15px rgba(214, 51, 108, 0.18); text-shadow: 0 1px 4px rgba(180, 40, 90, 0.45); }
    .scrapbook-layout { display: flex; justify-content: center; align-items: flex-start; gap: 24px; max-width: 1220px; width: 100%; position: relative; z-index: 2; }
    .photo-column { display: flex; flex-direction: column; gap: 18px; width: 190px; flex-shrink: 0; }
    .polaroid { background: #ffffff; padding: 9px 9px 22px 9px; border-radius: 8px; box-shadow: 0 10px 25px rgba(180, 40, 90, 0.18); text-align: center; transition: transform 0.25s ease; }
    .polaroid:nth-child(odd) { transform: rotate(-3deg); }
    .polaroid:nth-child(even) { transform: rotate(3deg); }
    .polaroid:hover { transform: scale(1.05) rotate(0deg); }
    .polaroid img { width: 100%; height: 155px; object-fit: cover; border-radius: 4px; background-color: #ffe3ec; display: block; }
    .polaroid span { display: block; margin-top: 7px; font-family: 'Patrick Hand', cursive; font-size: 15px; color: #d6336c; line-height: 1.25; }
    .notebook-paper { flex: 1; max-width: 620px; background-color: #fffdf9; border-radius: 12px; box-shadow: 0 18px 40px rgba(180, 40, 90, 0.22); position: relative; padding: 44px 36px 48px 64px; background-image: repeating-linear-gradient(to bottom, transparent 0px, transparent 33px, #ffd6e0 34px); line-height: 34px; overflow: hidden; }
    .notebook-paper::before { content: ''; position: absolute; top: 0; bottom: 0; left: 46px; width: 2px; background-color: #ff8fa3; }
    .washi-tape { position: absolute; top: -10px; left: 50%; transform: translateX(-50%) rotate(-2deg); width: 140px; height: 28px; background: rgba(255, 143, 163, 0.55); border-left: 2px dashed rgba(255, 255, 255, 0.7); border-right: 2px dashed rgba(255, 255, 255, 0.7); z-index: 3; }
    .letter-header { font-family: 'Quicksand', sans-serif; font-size: 26px; font-weight: 700; color: #d6336c; margin-bottom: 14px; line-height: 40px; }
    .letter-body { font-family: 'Quicksand', sans-serif; font-size: 16px; font-weight: 500; color: #4a3b42; line-height: 34px; white-space: pre-line; }
    .letter-signoff { font-family: 'Quicksand', sans-serif; font-size: 17px; font-weight: 700; color: #d6336c; margin-top: 24px; line-height: 34px; text-align: right; white-space: pre-line; }
    @media (max-width: 900px) {
      .scrapbook-layout { flex-direction: column; align-items: center; }
      .photo-column { display: grid; grid-template-columns: repeat(2, 1fr); width: 100%; max-width: 420px; gap: 14px; }
      .polaroid { width: 100%; padding: 8px 8px 18px 8px; }
      .polaroid img { height: 145px; }
      .notebook-paper { width: 100%; padding: 36px 20px 40px 46px; }
      .notebook-paper::before { left: 32px; }
      .letter-body { font-size: 15px; }
    }
  </style>
</head>
